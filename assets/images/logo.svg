<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M50,8 L85,22 C85,55 50,88 50,88 C50,88 15,55 15,22 Z" fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Inner Gold Trim -->
  <path d="M50,14 L80,26 C80,52 50,80 50,80 C50,80 20,52 20,26 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
  
  <!-- Academic Torch / Lamp Base -->
  <path d="M42,66 L58,66 L55,54 L45,54 Z" fill="url(#goldGrad)" />
  
  <!-- Red Emergency Cross / Flash Star -->
  <rect x="47" y="30" width="6" height="18" rx="2" fill="#ef4444" />
  <rect x="41" y="36" width="18" height="6" rx="2" fill="#ef4444" />
  
  <!-- Radiating Alert Arcs -->
  <circle cx="50" cy="39" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Central White Shield Accent -->
  <circle cx="50" cy="39" r="3" fill="#ffffff" />
</svg>
